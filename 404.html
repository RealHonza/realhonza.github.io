<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Přesměrování...</title>
  <script>
    const path = window.location.pathname.toLowerCase();
    
    // Pokud cesta začíná na /geomat (jakkoliv napsané)
    if (path === '/geomat' || path.startsWith('/geomat/')) {
      // Zachová i případné další části cesty, parametry (?...) a kotvy (#...)
      const rest = window.location.pathname.slice('/geomat'.length);
      const target = 'https://realhonza.github.io/GeoMAT' + (rest || '/') + window.location.search + window.location.hash;
      window.location.replace(target);
    }
  </script>
</head>
<body>
  <p>Stránka nenalezena (404). Pokud hledáš aplikaci GeoMAT, <a href="https://realhonza.github.io/GeoMAT/">klikni zde</a>.</p>
</body>
</html>
